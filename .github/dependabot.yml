# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Dependabot reads this file only from the default branch, so a maintained
  # release line needs its own block with target-branch. Without it v4.x
  # receives no updates and drifts, as it did before #34.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v4.x"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
