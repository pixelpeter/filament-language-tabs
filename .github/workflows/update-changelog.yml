name: "Update Changelog"

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          # The default GITHUB_TOKEN cannot push to main. Branch protection
          # requires changes to go through a pull request, and that token is
          # not a repository admin, so the push is rejected with GH006.
          # CHANGELOG_TOKEN is a fine-grained PAT owned by a repository admin,
          # which protection lets through because "Include administrators" is
          # off. The fallback keeps the checkout working if the secret is
          # missing; the commit step then fails as before.
          token: ${{ secrets.CHANGELOG_TOKEN || github.token }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
