name: "Update Changelog"

on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v4.x
          # No token override here, unlike main. v4.x carries no branch
          # protection, so the default GITHUB_TOKEN can push to it. Passing
          # CHANGELOG_TOKEN would persist an admin-owned PAT in .git/config
          # for every later step, including the third-party actions below.
          # If protection is ever enabled on v4.x, add the token back and
          # pin those actions to commit SHAs first.

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: v4.x
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
