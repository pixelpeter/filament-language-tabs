name: run-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]
        php: [ 8.5, 8.4, 8.3 ]
        laravel: [ 13.*, 12.* ]
        stability: [ prefer-stable ]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests with coverage
        run: vendor/bin/pest --coverage-clover build/logs/clover.xml

      - name: Upload coverage results to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/logs/clover.xml
          # Every matrix job reports coverage for the same commit. Without
          # parallel mode the first job to finish closes the Coveralls build
          # and every later job is rejected with "Can't add a job to a build
          # that is already closed", which fails that job and, because
          # fail-fast is on, cancels the rest of the matrix.
          parallel: true
          # Coveralls needs a distinct flag per parallel job. The matrix values
          # contain dots and asterisks, so the job index is used instead.
          flag-name: run-${{ strategy.job-index }}

  coverage:
    name: Close Coveralls build
    needs: test
    # Runs even when the matrix fails, so a build is never left open.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Close the parallel Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          # Flags that did not report in this build, because fail-fast
          # cancelled them, carry their coverage forward from the last build.
          carryforward: "run-0,run-1,run-2,run-3,run-4,run-5"
